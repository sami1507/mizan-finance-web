name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, data integrity, build and browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret-00000000000000
      BETTER_AUTH_URL: http://localhost:3100
      PGLITE_DATA_DIR: data/ci
      PLAYWRIGHT_USE_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:config
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:persistence
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  postgres:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mizan_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: mizan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan_test -d mizan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCE_TEST_DATABASE_URL: postgresql://mizan_test:local_ci_only@localhost:5432/mizan_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- tests/finance.integration.test.ts tests/simulator.integration.test.ts tests/locales.integration.test.ts tests/delivery.integration.test.ts
